spring:
  config:
    # 로컬 실행 시 루트 .env 값을 읽는다. 파일이 없으면 건너뛰고, 같은 이름의 환경변수가 있으면 환경변수가 우선한다.
    import: optional:file:../.env[.properties]

  application:
    name: dipsource

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dipsource}
    username: ${SPRING_DATASOURCE_USERNAME:dipsource}
    password: ${SPRING_DATASOURCE_PASSWORD:dipsource}

  sql:
    init:
      # schema.sql로 PostgreSQL 확장(pg_trgm, fuzzystrmatch)을 만든다. 내장 DB가 아니어도 실행하려면 always가 필요하다
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:not-configured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          github:
            user-name-attribute: id
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

r2:
  enabled: ${R2_ENABLED:false}
  endpoint: ${R2_ENDPOINT:https://placeholder.r2.cloudflarestorage.com}
  access-key: ${R2_ACCESS_KEY:placeholder}
  secret-key: ${R2_SECRET_KEY:placeholder}
  bucket: ${R2_BUCKET:placeholder}
  public-url: ${R2_PUBLIC_URL:https://placeholder.example.com}

server:
  port: 8080
  forward-headers-strategy: framework

app:
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  cookie:
    secure: ${COOKIE_SECURE:false}
  # 로그인 성공 후 리다이렉트할 프론트 주소
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # 미니홈피 GitHub API rate limit용 (선택). 로그인 OAuth secret과 별개
  github:
    token: ${GITHUB_TOKEN:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 1800
    refresh-token-validity: 1209600
