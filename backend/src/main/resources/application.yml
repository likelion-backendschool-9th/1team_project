spring:
  application:
    name: dipsource

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dipsource}
    username: ${SPRING_DATASOURCE_USERNAME:dipsource}
    password: ${SPRING_DATASOURCE_PASSWORD:dipsource}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
