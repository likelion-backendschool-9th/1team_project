spring:
  config:
    # 로컬 실행 시 루트 .env 값을 읽는다. 파일이 없으면 건너뛰고, 같은 이름의 환경변수가 있으면 환경변수가 우선한다.
    import: optional:file:../.env[.properties]

  application:
    name: dipsource

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dipsource}
    username: ${SPRING_DATASOURCE_USERNAME:dipsource}
    password: ${SPRING_DATASOURCE_PASSWORD:dipsource}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: id

server:
  port: 8080

app:
  # 로그인 성공 후 리다이렉트할 프론트 주소
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # 미니홈피 GitHub API rate limit용 (선택). 로그인 OAuth secret과 별개
  github:
    token: ${GITHUB_TOKEN:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 1800
    refresh-token-validity: 1209600
