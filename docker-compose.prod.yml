services:
  db:
    image: postgres:16
    container_name: dipsource-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_BACKEND}
    container_name: dipsource-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # OAuth 로그인 후 돌아갈 프론트 주소. 비어 있으면 localhost:3000으로 튕기므로 필수로 둔다.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL을 서버 .env에 설정해야 합니다}
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID를 서버 .env에 설정해야 합니다}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET을 서버 .env에 설정해야 합니다}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID를 서버 .env에 설정해야 합니다}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET을 서버 .env에 설정해야 합니다}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_FRONTEND}
    container_name: dipsource-frontend
    restart: always
    environment:
      API_ORIGIN: http://backend:8080
      BROWSER_API_ORIGIN: ""
    depends_on:
      - backend

  proxy:
    image: nginx:1.27
    container_name: dipsource-proxy
    restart: always
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
