services:
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: npm run dev

  backend:
    build:
      context: ./backend
      target: build
    entrypoint: []
    volumes:
      - ./backend:/app
      - gradle_cache:/root/.gradle
    command: ./gradlew bootRun

volumes:
  gradle_cache:
