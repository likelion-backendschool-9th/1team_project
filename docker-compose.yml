services:
  db:
    image: postgres:16
    container_name: dipsource-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    build: ./docker/elasticsearch
    container_name: dipsource-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      # 개발 환경 전용. 운영은 docker-compose.prod.yml에서 인증을 켠다
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: dipsource-backend
    restart: always
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_ES_ENABLED: "true"
      SEARCH_ENGINE: ${SEARCH_ENGINE:-elasticsearch}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # 미니홈피 잔디(GitHub GraphQL)용 토큰. 없으면 잔디가 비어 보인다. (로그인 OAuth와 별개)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # 최고 관리자(MASTER)로 지정할 회원 이메일. 이 이메일로 가입한 뒤 서버를 다시 띄우면 적용된다
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-not-configured}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-not-configured}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dipsource-frontend
    restart: always
    environment:
      API_ORIGIN: http://backend:8080
      BROWSER_API_ORIGIN: ""
      # DM 실시간(WebSocket) 주소. 없으면 DM 창이 "실시간 연결 꺼짐"이 되어 메시지가 상대에게 가지 않는다.
      # 상대 주소라 브라우저가 접속한 주소 기준으로 붙는다: 3000(Next가 백엔드로 넘김)·3001(nginx가 넘김) 둘 다 된다.
      # 백엔드는 FRONTEND_BASE_URL과 같은 주소에서 온 연결만 받으므로, 브라우저에서 여는 주소를 FRONTEND_BASE_URL과 맞춘다.
      NEXT_PUBLIC_WS_URL: /api/v1/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27
    container_name: dipsource-proxy
    restart: always
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  elasticsearch_data:
