# 바깥 프록시(HTTPS)가 알려준 원래 프로토콜을 이어서 넘긴다. 없으면 지금 프로토콜(http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket 요청이면 Connection: upgrade, 아니면 일반 연결로 넘긴다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    # API + OAuth 로그인 경로 → 백엔드
    location ~ ^/(api|oauth2|login/oauth2)/ {
        # 데모 ZIP 업로드 (백엔드 한도 12MB). 기본값 1MB면 413으로 끊긴다
        client_max_body_size 12m;
        proxy_pass http://backend:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket(DM) → 백엔드. 백엔드 context-path(/api/v1) 아래에 있다.
    # 위 정규식 location보다 먼저 잡히도록 ^~ 를 쓴다(업그레이드 헤더가 필요해서 따로 둔다).
    location ^~ /api/v1/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
    }

    # 나머지 → 프론트엔드
    # 로컬 Docker는 프론트가 개발 모드(npm run dev)라 새로고침 연결(/_next/hmr, WebSocket)이 필요하다.
    # 이걸 넘기지 않으면 3001로 열었을 때 화면 코드가 붙지 않아 DM을 비롯한 모든 버튼이 동작하지 않는다. (배포는 영향 없음)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host      $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
