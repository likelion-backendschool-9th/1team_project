# 바깥 프록시(HTTPS)가 알려준 원래 프로토콜을 이어서 넘긴다. 없으면 지금 프로토콜(http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    # API + OAuth 로그인 경로 → 백엔드
    location ~ ^/(api|oauth2|login/oauth2)/ {
        # 데모 ZIP 업로드 (백엔드 한도 12MB). 기본값 1MB면 413으로 끊긴다
        client_max_body_size 12m;
        proxy_pass http://backend:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket(DM) → 백엔드. 백엔드 context-path(/api/v1) 아래에 있다.
    # 위 정규식 location보다 먼저 잡히도록 ^~ 를 쓴다(업그레이드 헤더가 필요해서 따로 둔다).
    location ^~ /api/v1/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
    }

    # 나머지 → 프론트엔드
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host      $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
